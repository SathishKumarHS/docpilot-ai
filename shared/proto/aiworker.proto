syntax = "proto3";

package aiworker;

service AiWorkerService {
  rpc IndexDocument(IndexDocumentRequest) returns (IndexDocumentResponse);
  rpc Ask(AskRequest) returns (AskResponse);
  rpc AskStream(AskRequest) returns (stream AskStreamResponse);
  rpc SuggestQuestions(SuggestQuestionsRequest) returns (SuggestQuestionsResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}

message IndexDocumentRequest {
  string document_id = 1;
  repeated Chunk chunks = 2;
}

message Chunk {
  string chunk_id = 1;
  int32 chunk_index = 2;
  string text = 3;
}

message IndexDocumentResponse {
  int32 indexed_chunks = 1;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  USER = 1;
  ASSISTANT = 2;
}

message ChatMessage {
  MessageRole role = 1;
  string content = 2;
}

message AskRequest {
  string question = 1;
  optional string document_id = 2;
  repeated ChatMessage chat_history = 3;
}

message AskResponse {
  string answer = 1;
}

message AskStreamResponse {
  string token = 1;
  bool done = 2;
}

message SuggestQuestionsRequest {
  string document_id = 1;
  repeated ChatMessage chat_history = 2;
}

message SuggestQuestionsResponse {
  repeated string questions = 1;
}

message DeleteDocumentRequest {
  string document_id = 1;
}

message DeleteDocumentResponse {
  bool deleted = 1;
}

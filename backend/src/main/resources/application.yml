spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ai-worker:
  base-url: ${AI_WORKER_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,env

feature-flags:
  refresh-interval-ms: 300000
  service-url: ${FEATURE_FLAG_SERVICE_URL:http://localhost:8090}
  redis-key: "feature:flags"

docpilot:
  cleanup:
    cron: "0 0 * * * *" # every hour

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:docpilot}

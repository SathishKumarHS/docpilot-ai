spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

ai-worker:
  base-url: ${AI_WORKER_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health

feature-flags:
  refresh-interval-ms: 300000
  service-url: ${FEATURE_FLAG_SERVICE_URL:feature-flag:9090}
  redis-key: "feature:flags"

docpilot:
  version: 1.1.0
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

  anonymous-session:
    expiration-hours: ${ANONYMOUS_SESSION_EXPIRATION_HOURS:24}

  cleanup:
    cron: "0 0 * * * *" # every hour

  ratelimit:
    limits:
      "POST:/api/v1/auth/login":
        capacity: 5
        period: 1m
      "POST:/api/v1/auth/register":
        capacity: 3
        period: 1m
      "POST:/api/v1/ask":
        capacity: 5
        period: 1m
      "POST:/api/v1/documents":
        capacity: 3
        period: 1m
      "GET:/api/v1/documents/**":
        capacity: 20
        period: 1m
      "DELETE:/api/v1/documents/**":
        capacity: 5
        period: 1m

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:docpilot}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-worker:
    build: ./ai-worker
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      QDRANT_URL: http://qdrant:6333
    restart: unless-stopped
    depends_on:
      - qdrant

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/docpilot
      AI_WORKER_BASE_URL: http://ai-worker:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-worker:
        condition: service_started

volumes:
  postgres-data:
  qdrant_data:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  feature-flag:
    build: ./feature-flag
    ports:
      - "8090:8090"
      - "9090:9090"
    environment:
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      GRPC_PORT: 9090
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:8090/health -O /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ai-worker:
    build: ./ai-worker
    ports:
      - "8000:8000"
      - "50051:50051"
    env_file:
      - ./.env
    environment:
      QDRANT_URL: http://qdrant:6333
      GRPC_PORT: 50051
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - qdrant

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/docpilot
      AI_WORKER_SERVICE_URL: ai-worker:50051
      REDIS_HOST: redis
      FEATURE_FLAG_SERVICE_URL: feature-flag:9090
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      feature-flag:
        condition: service_healthy

volumes:
  postgres-data:
  qdrant_data:
  minio-data:
  redis-data:
